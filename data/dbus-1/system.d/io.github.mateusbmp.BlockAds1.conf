<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- blockads-linux daemon API. Every method is also
     checked against polkit by the daemon; this file only limits who may own
     the name and which interfaces may be called. Installed to
     /usr/share/dbus-1/system.d/. There is no bus-activation file. -->
<busconfig>
  <policy user="blockads">
    <allow own="io.github.mateusbmp.BlockAds1"/>
  </policy>

  <policy context="default">
    <deny own="io.github.mateusbmp.BlockAds1"/>
    <allow send_destination="io.github.mateusbmp.BlockAds1"
           send_interface="io.github.mateusbmp.BlockAds1.Daemon"/>
    <allow send_destination="io.github.mateusbmp.BlockAds1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.mateusbmp.BlockAds1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.github.mateusbmp.BlockAds1"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="io.github.mateusbmp.BlockAds1"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
  </policy>
</busconfig>
